name: Attach platform packages to a release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag receiving platform packages
        required: true
        type: string
      source_run_id:
        description: Actions run ID containing packages to reuse
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          pattern: base-workbench-*
          path: release-assets
          merge-multiple: true
      - name: Attach files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' release_files < <(
            find release-assets -type f -name 'base-workbench-*.zip' -print0
            find release-assets -type f -name 'base-workbench-*.exe' -print0
            find release-assets -type f -name 'base-workbench-*.apk' -print0
          )
          if (( ${#release_files[@]} == 0 )); then
            echo "No platform package files were downloaded" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" "${release_files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
